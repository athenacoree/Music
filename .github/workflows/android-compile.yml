name: Android build and signed release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/music-release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/music-release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.ANDROID_KEYSTORE_FILE != '' }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload signed APK
        if: ${{ env.ANDROID_KEYSTORE_FILE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Music-signed-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Report missing signing secrets
        if: ${{ env.ANDROID_KEYSTORE_FILE == '' }}
        run: echo "Release signing skipped: configure the four ANDROID_KEYSTORE_* GitHub Actions secrets."

      - name: Decode release keystore
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSIC_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing MUSIC_KEYSTORE_BASE64 repository secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP/music-signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/music-signing/release.p12"

      - name: Build signed release APK and bundle
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          MUSIC_KEYSTORE_FILE: ${{ runner.temp }}/music-signing/release.p12
          MUSIC_KEYSTORE_PASSWORD: ${{ secrets.MUSIC_KEYSTORE_PASSWORD }}
          MUSIC_KEY_ALIAS: ${{ secrets.MUSIC_KEY_ALIAS }}
          MUSIC_KEY_PASSWORD: ${{ secrets.MUSIC_KEY_PASSWORD }}
        run: |
          test -n "$MUSIC_KEYSTORE_PASSWORD" || { echo "Missing MUSIC_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$MUSIC_KEY_ALIAS" || { echo "Missing MUSIC_KEY_ALIAS"; exit 1; }
          test -n "$MUSIC_KEY_PASSWORD" || { echo "Missing MUSIC_KEY_PASSWORD"; exit 1; }
          gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Music-signed-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 3
          if-no-files-found: error
